services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: diplom-3d:latest
    container_name: diplom-3d
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - diplom-data:/app/data
      - diplom-models:/app/public/models
      - diplom-logs:/app/logs
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://127.0.0.1:8080/api/specialties',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  diplom-data:
  diplom-models:
  diplom-logs:
