services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: diplom-3d:latest
    container_name: diplom-3d
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./models/uploads:/app/models/uploads
      - ./logs:/app/logs
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://127.0.0.1:8080/api/specialties',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
